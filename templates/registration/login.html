{% load static cras_extras %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar - CRAS</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Plus+Jakarta+Sans:wght@100..900&display=swap" rel="stylesheet">
    <link href="{% static_v 'cras/css/tema.css' %}" rel="stylesheet">
</head>
<body class="login-corpo">
    <div class="login-card">
        <div class="login-logo"><span class="material-symbols-outlined" style="font-size:30px">volunteer_activism</span></div>
        <h1 class="login-titulo">CRAS</h1>
        <p class="sub">Sistema de Gestão de Atendimentos</p>
        {% if form.errors %}
        <div class="alerta alerta-erro">
            <span class="material-symbols-outlined">error</span> Usuário ou senha inválidos.
        </div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="campo">
                <label>Usuário</label>
                <input type="text" name="username" class="form-control" autofocus required>
            </div>
            <div class="campo">
                <label>Senha</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button class="btn btn-primario btn-bloco" type="submit">
                <span class="material-symbols-outlined">login</span> Entrar
            </button>
            <input type="hidden" name="next" value="{{ next }}">
        </form>
    </div>
</body>
</html>
