{% extends 'base.html' %}
{% block titulo %}Nova senha - CRAS{% endblock %}
{% block conteudo %}
<div class="topo-pagina">
    <div>
        <h1>Nova senha de {{ usuario }}</h1>
        <p class="topo-sub">Usuário: {{ usuario.username }}</p>
    </div>
</div>
<div class="card" style="max-width:520px">
    <div class="card-pad">
        <form method="post" novalidate>
            {% csrf_token %}
            {% for campo in form %}
            {% include '_campo.html' %}
            {% endfor %}
            <div class="form-acoes">
                <button class="btn btn-primario" type="submit">
                    <span class="material-symbols-outlined">key</span> Definir senha
                </button>
                <a class="btn btn-secundario" href="{% url 'usuarios:lista' %}">Voltar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
