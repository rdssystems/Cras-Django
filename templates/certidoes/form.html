{% extends 'base.html' %}
{% block titulo %}Certidão - CRAS{% endblock %}
{% block conteudo %}
<div class="topo-pagina">
    <div>
        <h1>{{ titulo }}</h1>
    </div>
</div>
<div class="card" style="max-width:900px">
    <div class="card-pad">
        <form method="post">
            {% csrf_token %}
            <div class="form-row">
                {% for campo in form %}
                {% include '_campo.html' with campo=campo %}
                {% endfor %}
            </div>
            <div class="form-acoes">
                <button class="btn btn-primario" type="submit">
                    <span class="material-symbols-outlined">save</span> Salvar
                </button>
                <a class="btn btn-secundario" href="{% url 'certidoes:lista' %}">Voltar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
